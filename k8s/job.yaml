apiVersion: batch/v1
kind: Job
metadata:
  name: sample-job
  namespace: microservices-cicd

spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: task-container
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - echo "Starting Kubernetes Job";
              echo "Running database migration task";
              echo "Job completed successfully"