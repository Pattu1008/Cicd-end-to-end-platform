
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.product.secretName }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DB_USERNAME: {{ .Values.product.secretData.DB_USERNAME | quote }}
  DB_PASSWORD: {{ .Values.product.secretData.DB_PASSWORD | quote }}
  API_TOKEN: {{ .Values.product.secretData.API_TOKEN | quote }}
