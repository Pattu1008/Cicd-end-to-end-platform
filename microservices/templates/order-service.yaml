
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.order.service.type }}
  selector:
    app: order-service
  ports:
    - name: http
      port: {{ .Values.order.service.port }}
      targetPort: {{ .Values.order.containerPort }}
      nodePort: {{ .Values.order.service.nodePort }}
      protocol: TCP
